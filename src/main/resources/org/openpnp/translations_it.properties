BacklashCompensationConfigurationWizard.Action.Calibrate.Description=<html>\r\n<p>Calibra le impostazioni di compensazione del gioco meccanico dell'asse usando il fiducial di calibrazione.</p>\r\n<p>Assicurati che l'attrezzatura di calibrazione sia predisposta e presente.</p><p>Considera di usare questa funzione da Problemi e soluzioni, dove trovi istruzioni passo passo<br/>\r\nper i passaggi preparatori necessari e per la calibrazione nella sequenza corretta. Ottieni anche numerosi link al Wiki.</p>\r\n</html>
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.BacklashOffsetLabel.text=Offset del gioco meccanico
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.Border.title=Compensazione e calibrazione del gioco meccanico
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.CompensationMethodLabel.text=Metodo di compensazione
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.CompensationMethodLabel.toolTipText=<html>\n<p>La compensazione del gioco meccanico serve a evitare gli effetti di lassità o giochi negli <br/>\naccoppiamenti meccanici dell'asse indicato.  Quando l'attuatore inverte il senso di marcia, <br/>\nc'è spesso un istante in cui non accade nulla, perché il lasco di una cinghia o il gioco <br/>\ndi una vite o di un pignone e cremagliera devono essere colmati prima che la forza meccanica <br/>\npossa essere di nuovo trasmessa.</p>\n\n<ul>\n<li>\n<strong>None\:</strong>\nNon viene eseguita alcuna compensazione del gioco meccanico. </li>\n<li>\n<strong>OneSidedPositioning\:</strong><br/>\nLa compensazione avviene raggiungendo sempre la posizione finale dallo stesso lato.<br/>\nL'offset del gioco non deve essere molto preciso, ovvero può essere maggiore del gioco<br/> \neffettivo e la macchina raggiungerà comunque la posizione corretta e precisa.<br/>\nLa macchina deve sempre eseguire un movimento aggiuntivo e forza un arresto completo<br/>\n tra i segmenti di movimento.</li>\n<li>\n<strong>OneSidedOptimizedPositioning\:</strong><br/>\nFunziona come OneSidedPositioning, ma esegue il movimento aggiuntivo solo quando arriva <br/>\ndal lato sbagliato. Serve solo la metà dei movimenti aggiuntivi.</li>\n<li>\n<strong>DirectionalCompensation (sperimentale\!)\:</strong><br/>\nLa compensazione viene applicata nel senso di marcia. L'offset viene aggiunto alla <br/>\ncoordinata di destinazione effettiva se il movimento avviene nella direzione dell'offset (che può essere positivo <br/>\no negativo); nessun offset viene aggiunto se il movimento è contrario all'offset.<br/>\nNon serve alcun movimento aggiuntivo. La macchina può anche muoversi in modo più fluido, perché non <br/>\nserve alcun cambio di direzione.<br/>\nTuttavia\: l'offset deve corrispondere con precisione al gioco meccanico reale.</li>\n</ul>\n</html>
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.DistanceTestLabel.text=<html>\n<body style\="text-align\:right">\n<p>\nGioco <span style\="color\:\#005BD9">&mdash;&mdash;</span>\n</p>\n<p>\nInviluppo <span style\="color\:\#000077">&mdash;&mdash;</span>\n</p>\n<p>\nSovraelongazione <span style\="color\:\#FF0000">&mdash;&mdash;</span>\n</p>\n<p>\nCasuale <span style\="color\:\#BB7700">&mdash;&mdash;</span>\n</p>\n<br/>\n<p>\nTempo di movimento <span style\="color\:\#00AA00">&mdash;&mdash;</span>\n</p>\n<br/>\n<br/>\n<p>\navanti/ <span style\="color\:\#777777">indietro</span><br/>\nin funzione della distanza.\n<p/>\n</body>\n</html>
