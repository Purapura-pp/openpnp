GcodeDriverSettings.SettingsPanel.CommandTimeout.text=Timeout del comando [ms]
GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.text=Tempo di attesa del comando $ [ms]
GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.toolTipText=<html>\n<p>Ogni volta che un comando inizia con il segno <strong>$ </strong>, aggiungi questo tempo di attesa prima di<br/>\ninviare il comando successivo. È noto che il controller TinyG richiede questa<br/>\npausa per poter scrivere le impostazioni nella EEPROM senza interruzioni. </p>\n<br/>\n<p>Nota\: in un GcodeAsyncDriver senza controllo di flusso con conferma, <br/>\nquesto funziona con certezza solo se i comandi $ vengono inviati a un  <br/>\ncontroller inattivo. È il caso in cui i comandi $ vengono inviati per primi nel <br/>\n<strong>CONNECT_COMMAND</strong>.</p> \n</html>
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.text=Comprimere il G-code?
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.toolTipText=<html>\r\n<p>Rimuove dal G-code gli spazi inutili e le cifre decimali finali<br/>\r\nper velocizzare le trasmissioni verso il controller.</p>\r\n<p>Nota\: funziona solo con la sintassi G-code normale.</p>\r\n<p>Esempio\:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1&nbsp;&nbsp;X100.0000     Y20.1000&nbsp;&nbsp;&nbsp;&nbsp;</code></p>\r\n<p>viene compresso in\:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1X100Y20.1</code></p>\r\n</html>
GcodeDriverSettings.SettingsPanel.ConnectWaitTimeoutLabel.text=Tempo di attesa alla connessione [ms]
GcodeDriverSettings.SettingsPanel.DetectFirmwareButton.text=Rileva il firmware
GcodeDriverSettings.SettingsPanel.FirmwareConfigurationTextArea.Detecting.text=Rilevamento in corso...
GcodeDriverSettings.SettingsPanel.LetterVariablesLabel.text=Variabili a lettera?
GcodeDriverSettings.SettingsPanel.LetterVariablesLabel.toolTipText=Le variabili degli assi nel G-code sono denominate usando le lettere degli assi invece del tipo di asse.
GcodeDriverSettings.SettingsPanel.LogGCodeLabel.text=Registrare il G-code?
GcodeDriverSettings.SettingsPanel.LogGCodeLabel.toolTipText=Registra il G-code generato in un file separato nella sottocartella driver di .openpnp2.
GcodeDriverSettings.SettingsPanel.MaxFeedRate.text=Velocità di avanzamento max. [/min]
GcodeDriverSettings.SettingsPanel.MaxFeedRate.toolTipText=<html><p>Velocità di avanzamento massima del percorso utensile in unità del driver al minuto. </p>\n<p>Imposta 0 per disattivarla e usare solo i limiti di velocità degli assi. I movimenti diagonali risulteranno così più rapidi. </p>\n</html>
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.text=Tipo di controllo del movimento
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.toolTipText=<html>\n<p>Determina come il MotionPlanner di OpenPnP pianificherà il movimento e come dialogherà <br/>\ncon il controller\:</p>\n<ul>\n\n<li><strong>ToolpathFeedRate\:</strong><br/>\nApplica al percorso utensile il limite nominale di velocità di avanzamento del driver moltiplicato per il fattore di velocità.<br/>\nLa velocità di avanzamento del driver deve essere specificata. Non viene applicato alcun controllo dell'accelerazione.</li>\n\n<li><strong>EuclideanAxisLimits\:</strong><br/>\nApplica i limiti di velocità di avanzamento, accelerazione e jerk degli assi moltiplicati per i rispettivi fattori di velocità. <br/>\nLa metrica euclidea viene calcolata per permettere alla macchina di andare più veloce in diagonale.<br/>\nOpenPnP imposta solo il massimo del fattore di velocità; l'aumento e la riduzione della velocità sono <br/>\nlasciati interamente al controller. </li>  \n\n<li><strong>ConstantAcceleration\:</strong><br/>\nPianifica il movimento assumendo un controller con controllo del movimento ad accelerazione costante. </li>\n\n<li><strong>ModeratedConstantAcceleration\:</strong><br/>\nPianifica il movimento assumendo un controller ad accelerazione costante, ma<br/>\nmodera accelerazione e velocità per avvicinarle a quelle del controllo del terzo ordine, ottenendo<br/>\nun movimento che richiede lo stesso tempo e ha un'accelerazione media simile. <br/>\nQuesto riduce già un po' le vibrazioni.</li>\n\n<li><strong>SimpleSCurve\:</strong><br/>\nPianifica il movimento assumendo un controller con controllo del movimento a curva S semplificata. <br/>\nLe curve S semplificate non hanno una fase ad accelerazione costante, ma solo fasi di jerk (ad es. TinyG, Marlin).</li>\n\n<li><strong>Simulated3rdOrderControl\:</strong><br/>\nPianifica il movimento assumendo un controller ad accelerazione costante, ma<br/>\nsimulando il controllo del terzo ordine con interpolazione a passi temporali. </li> \n\n<li><strong>Full3rdOrderControl\:</strong><br/>\nPianifica il movimento assumendo un controller con controllo del movimento del terzo ordine completo.</li> \n\n</html>
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.text=Rimuovere i commenti?
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.toolTipText=<html>\n<p>Rimuove i commenti dal G-code per velocizzare le trasmissioni <br/>\nverso il controller.</p>\n<p>Nota\: funziona solo con lo stile di sintassi G-code.</p>\n<p>Esempio\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 <span style\="color\:\#007700">(move to)</span> X100 Y20 <span style\="color\:\#007700">; move to the given X, Y</span><br/></code></p>\n<p>viene inviato come\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 X100 Y20 </code></p>\n</html>
