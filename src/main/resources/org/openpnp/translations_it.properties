BlindsFeederArrayConfigurationWizard.lblOcrFontName.toolTipText=<html>Nome del carattere OCR da riconoscere oppure [Barcode].<br/>\r\nI caratteri a spaziatura fissa funzionano molto meglio, permettono una risoluzione minore e quindi un <br/>\r\nfunzionamento più rapido. Usa un carattere in cui tutti i simboli usati siano facilmente distinguibili.<br/>\r\nSono molto preferibili i caratteri con una netta separazione tra i glifi.</html>
