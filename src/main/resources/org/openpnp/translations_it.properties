AbstractReferenceDriverConfigurationWizard.lblMinSupportedSpeed.text=Velocità minima
AbstractReferenceDriverConfigurationWizard.lblMinSupportedSpeed.toolTipText=<html>\r\n<p>\r\nVelocità % minima pienamente supportata dal driver.\r\n</p><p>\r\nVelocità minime eccessivamente basse richiedono una precisione eccessiva per<br/>\r\nvelocità di avanzamento, accelerazione (e jerk). Mantenendo la velocità % minima a<br/>\r\nlivelli ragionevoli (ad es. 5%), il calcolo può essere ottimizzato. <br/>\r\nServono meno cifre decimali (GcodeDriver), il che riduce la banda<br/>\r\nseriale necessaria.\r\n</p><p>\r\nVelocità inferiori sono comunque possibili, ma cambiano leggermente le caratteristiche,<br/>\r\nad es. accelerano più rapidamente e mantengono la velocità di crociera più a lungo.\r\n</p>\r\n</html>\r\n
