GcodeDriverSettings.lblCompressExcludes.text=Caratteri esclusi dalla compressione
GcodeDriverSettings.lblCompressExcludes.toolTipText=<html>\r\n<p>\r\nLa compressione del G-code segue le regole dello standard NIST RS274NGC<br/>\r\nper le normali righe di comando G e M.<br/>\r\nEsistono però alcune estensioni della sintassi, standard e proprietarie,<br/>\r\nper le quali la compressione e la rimozione dei commenti non sono ammissibili. Per supportare queste<br/>\r\nestensioni puoi indicare un elenco di caratteri che fungono da <em>parentesi</em> o<br/>\r\n<em>apici</em> attorno a queste parti delle righe di comando. \r\n</p>\r\n<p>\r\nEcco alcuni esempi tipici\:<br/>\r\n<code>&quot; &\#x27; &lt;&gt; {} [] ()</code><br/>\r\n</p>\r\n<p>\r\nA causa di possibili ambiguità sintattiche (escaping, annidamento) tutto ciò che si trova tra<br/>\r\nil carattere di esclusione più a sinistra e quello più a destra viene escluso in via cautelativa dalla<br/>\r\ncompressione e dalla rimozione dei commenti. Se viene trovato un solo carattere di esclusione,<br/>\r\nviene escluso il resto della riga.<br/>\r\n</p>\r\n<p>\r\nNote\: usa i caratteri <code>[]</code> per supportare le <em>espressioni</em> della sezione<br/>\r\n3.3.2.3 dello standard NIST RS274NGC. Aggiungi i caratteri <code>()</code> se vuoi conservare<br/>\r\ni commenti tra parentesi tonde quando usi la rimozione dei commenti. I commenti a fine riga<br/>\r\nintrodotti da punto e virgola verranno comunque rimossi.\r\n</p>\r\n</html>
GcodeDriverSettings.lblMinSpeed.text=Velocità minima supportata %
GcodeDriverSettings.lblMinSpeed.toolTipText=<html>\r\n<p>\r\nVelocità % minima supportata dal driver.\r\n</p><p>\r\nVelocità minime eccessivamente basse richiedono una precisione eccessiva per<br/>\r\nvelocità di avanzamento, accelerazione (e jerk). Mantenendo la velocità % minima a<br/>\r\nlivelli ragionevoli (ad es. 5%), il calcolo e la generazione del G-code possono essere<br/>\r\nottimizzati. Servono meno cifre decimali nel G-code, il che riduce la banda<br/>\r\nseriale necessaria.\r\n</p><p>\r\nVelocità inferiori sono comunque possibili, ma cambiano leggermente le caratteristiche,<br/>\r\nad es. accelerano più rapidamente e mantengono la velocità di crociera più a lungo.\r\n</p>\r\n</html>\r\n
