GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.toolTipText=<html>\r\nNumero massimo di passi di interpolazione usati per simulare il controllo del jerk.<br/>\r\nSignifica che l'accelerazione verrà aumentata o diminuita in altrettanti passi <br/>\r\nrispetto all'accelerazione massima.\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.text=Numero massimo di passi
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.toolTipText=<html>\r\nNumero massimo di passi utilizzabili per l'interpolazione di un singolo movimento.<br>\r\nUsa una frazione della profondità massima di coda del tuo controller. <br/>\r\nSe il numero viene superato, il pianificatore di movimento ricadrà su un singolo movimento moderato. \r\n</html>
