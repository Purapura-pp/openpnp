CameraConfigurationWizard.basicCalibrationInstructions=<html><ol><li>Appoggia sul piano un oggetto di larghezza e lunghezza note. La carta millimetrata è una scelta comoda ed efficace.<li>Inserisci larghezza e lunghezza dell'oggetto nei campi X e Y delle dimensioni dell'oggetto.<li>Telecamera superiore\: porta in Jog la telecamera in modo che sia centrata sull'oggetto e a fuoco.<li>Telecamera inferiore\: appoggia l'oggetto in piano sopra la telecamera in modo che sia a fuoco.<li>Premi Misura e usa il rettangolo di selezione nella vista della telecamera per misurare l'oggetto. <li>Al termine premi Conferma.<li>I valori calcolati di unità per pixel verranno inseriti nei campi X e Y.</ol></html>
CameraConfigurationWizard.downLookingCalibrationInstructions=<html>Calibrare le unità per pixel a due diversi livelli di Z permette a OpenPnP di interpretare correttamente le dimensioni degli oggetti in 3D, ovvero a qualsiasi distanza dalla telecamera. Se hai già calibrato in 2D, servono comunque due nuove misure 3D. La calibrazione in 3D richiede che posizioni e offset di ugello e telecamera, la Safe Z e il movimento base della macchina siano già configurati. <ol><li>Scegli un oggetto rettangolare di larghezza e lunghezza note che rientri nel campo visivo della telecamera. La carta millimetrata è una scelta comoda ed efficace. Inserisci larghezza e lunghezza dell'oggetto nei campi X e Y delle dimensioni dell'oggetto.<li>Appoggia l'oggetto sul piano. Nota che le unità per pixel primarie vanno calibrate a un'altezza Z vicina a quella della superficie superiore dei circuiti stampati da popolare, mentre quelle secondarie il più in alto possibile mantenendo l'oggetto ragionevolmente a fuoco. L'oggetto deve rientrare comodamente nel campo visivo a entrambe le altezze.<li>Porta in Jog l'ugello sopra il centro dell'oggetto e poi in basso fino a sfiorarne la superficie. <li>Se stai calibrando le unità per pixel primarie, puoi ora premere il pulsante di acquisizione della Z dell'ugello per acquisire l'altezza di lavoro predefinita (superficie del circuito stampato).<li>Premi Misura per posizionare automaticamente la telecamera sopra l'oggetto e usa il rettangolo di selezione della vista della telecamera per misurarlo. Se l'oggetto non è perfettamente a fuoco, usa il centro dei bordi sfocati per la misura. Al termine premi Conferma.<li>I valori calcolati di unità per pixel verranno inseriti nei campi X e Y. Le coordinate Z di oggetto e telecamera della misura vengono registrate.<li>Per la misura secondaria metti uno spessore sotto l'oggetto oppure, sulle macchine che possono spostare fisicamente in Z la telecamera superiore, porta in Jog la telecamera il più in alto possibile mantenendo l'oggetto ragionevolmente a fuoco. <li>Ripeti i passaggi da 3 a 6 per le unità per pixel secondarie. </ol></html>
CameraConfigurationWizard.upLookingCalibrationInstructions=<html>Calibrare le unità per pixel a due diversi livelli di Z permette a OpenPnP di interpretare correttamente le dimensioni degli oggetti in 3D, ovvero a qualsiasi distanza dalla telecamera. Se hai già calibrato in 2D, servono comunque due nuove misure 3D. La calibrazione in 3D richiede che posizioni e offset di ugello e telecamera, la Safe Z e il movimento base della macchina siano già configurati. <ol><li>Scegli un oggetto di larghezza, lunghezza e spessore noti che rientri nel campo visivo della telecamera. Inserisci larghezza, lunghezza e spessore dell'oggetto nei campi X, Y e Z delle dimensioni dell'oggetto qui sopra.<li>Appoggia l'oggetto ben allineato sul piano e prelevalo con un ugello.<li>Nota che le unità per pixel primarie vengono calibrate alla posizione della telecamera rivolta verso l'alto, mentre quelle secondarie vanno calibrate in una posizione più alta.<li>ATTENZIONE\: se l'ugello non è già sopra la posizione della telecamera rivolta verso l'alto, il passaggio successivo lo sposterà automaticamente in quella posizione.<li>Premi Misura e usa il rettangolo di selezione della vista della telecamera per misurare l'oggetto.  Se necessario, usa il pannello di Jog per ruotare l'ugello in modo che l'oggetto risulti allineato con il rettangolo di selezione.  Se l'oggetto non è perfettamente a fuoco, usa il centro dei bordi sfocati per la misura.  Al termine premi Conferma.<li>I valori calcolati di unità per pixel verranno inseriti nei campi X e Y. Le coordinate Z di oggetto e telecamera della misura vengono registrate.<li>Porta in Jog l'ugello il più in alto possibile mantenendo l'oggetto ragionevolmente a fuoco. <li>Ripeti i passaggi da 5 a 6 per le unità per pixel secondarie.</ol></html>
