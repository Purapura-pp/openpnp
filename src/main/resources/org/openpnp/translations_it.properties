GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.toolTipText=<html>\r\n<p>Il passo temporale minimo usato per interpolare i percorsi di movimento avanzati. Espresso in secondi.</p>\r\n</html>
