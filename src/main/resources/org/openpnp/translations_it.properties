BambooFeederAutoVisionConfigurationWizard.lblVisionType.text=Tipo di visione
BambooFeederAutoVisionConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Scegli il tipo di visione, poi premi <strong>Reimposta pipeline</strong> per assegnare la<br/>\r\npipeline predefinita di quel tipo. I fori di trascinamento vengono rilevati così\:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong>\: lo sfondo sotto i fori deve avere un colore vivace<br/>\r\n(verde per impostazione predefinita).</li>\r\n<li><strong>CircularSymmetry</strong>\: la forma dei fori deve essere circolare e il loro<br/>\r\ninterno/esterno uniforme.</li>\r\n</ul>\r\n<p>Entrambi i tipi di pipeline valutano ulteriormente i fori rilevati in base a dimensione, allineamento, passo<br/>\r\ne distanza attesa.</p>\r\n</html>
