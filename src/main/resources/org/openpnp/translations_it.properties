GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.text=Controllo di flusso con conferma?
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.toolTipText=<html>\r\n<p>La comunicazione con il controller è regolata attendendo la risposta "ok"<br/>\r\nprima di inviare il comando successivo. </p>\r\n<p>È più lenta di altri tipi di controllo di flusso, come RTS/CTS su una connessione seriale, quindi <br/>\r\nquesti ultimi sono preferibili.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.text=Conferma della posizione?
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.toolTipText=<html>Chiede al controller di riportare la posizione al termine di un movimento.<br/>\r\nSe è cambiata, la posizione interna di OpenPnP viene aggiornata. Il report di posizione viene <br/>\r\nusato anche per sincronizzare OpenPnP quando il controllo di flusso con conferma è disabilitato.<br/>\r\nAlmeno una delle due opzioni deve essere abilitata. La conferma della posizione consente<br/>\r\nun funzionamento asincrono più esteso. \r\n</html>
