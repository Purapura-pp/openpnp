# Conventions terminologiques du français
#
# Principe général : traduire l'interface, mais conserver en anglais les noms propres, les noms
# de classes et les quelques termes que la documentation et le wiki d'OpenPnP n'emploient qu'en
# anglais. L'utilisateur francophone doit pouvoir retrouver dans le wiki et sur les captures
# d'écran de la communauté ce qu'il voit à l'écran ; un terme traduit qui n'existe nulle part
# ailleurs lui coûte plus qu'il ne lui apporte.
#
# Quand un terme anglais est conservé mais mérite une explication, on met la glose entre
# parenthèses à la première occurrence d'un texte long : « jerk (variation d'accélération) ».
# On ne le fait pas sur les étiquettes de champ, trop courtes pour cela.
#
# Traductions retenues :
#   actuator actionneur        nozzle buse              nozzle tip embout de buse
#   feeder distributeur        part composant           package boîtier
#   placement placement        panel panneau            board carte
#   job tâche                  head tête                driver pilote
#   axis axe                   controller contrôleur    firmware micrologiciel
#   home origine (l'action : « prise d'origine »)       fiducial repère (fiducial)
#   vision vision              backlash jeu             settling stabilisation
#   feed rate vitesse d'avance units per pixel unités par pixel
#   pick prise                 place pose               discard rebut
#   wizard assistant           tab onglet               issue problème
#   solution solution          probing palpage          offset décalage
#   soft limits limites logicielles                     rate cadence
#
# Termes délibérément laissés en anglais (réfléchir avant de changer) :
#   Safe Z, Camera Z   noms de cotes présents dans presque toutes les fenêtres et dans tout le
#                      wiki ; les traduire couperait l'interface de sa documentation.
#   Gcode, G-code      nom d'un standard technique, jamais traduit dans le métier.
#   Pipeline           terme de vision par ordinateur employé tel quel en français ; « chaîne de
#                      traitement » n'est pas reconnu par les utilisateurs.
#   Jerk               grandeur de la commande de mouvement sans équivalent français établi.
#   Bottom Vision,     noms de fonctionnalités d'OpenPnP, cités comme tels dans le wiki et dans
#   Top Vision         les scripts de la communauté.
#   Noms de classes    GcodeDriver, ReferenceNozzle, ContactProbeNozzle, BlindsFeeder, etc. :
#                      ce sont des identifiants, pas du texte.
#   Valeurs d'énumér.  None, LeaveAsIs, WaitForStillstand, ... : elles proviennent des enums Java
#                      et s'affichent en anglais dans les listes déroulantes ; les traduire dans
#                      une explication empêcherait de les y retrouver.
#
# Le processus de lots et de vérification est décrit dans TRANSLATIONS.md et tools/i18n/README.md.

