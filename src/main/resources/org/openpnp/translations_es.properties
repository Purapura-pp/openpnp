FiducialVisionSettingsConfigurationWizard.lblParallaxAngle.text=Ángulo de paralaje
FiducialVisionSettingsConfigurationWizard.lblParallaxAngle.toolTipText=<html>\n<p>\nÁngulo con el que se separan entre sí los dos puntos de vista de paralaje de la cámara.<br/>\nElija un ángulo que favorezca el eje más rápido de su máquina\: 0° favorece a X, 90° favorece a Y.<br/>\nOtros ángulos pueden usarse para mejorar la exactitud o para compensar los reflejos del anillo de LED.\n</p>\n</html> \n\n
FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.text=Diámetro de paralaje
FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.toolTipText=<html>\n<p>\nCuando se indica el <strong>diámetro de paralaje</strong>, el localizador de fiduciales realizará su detección desde dos<br/>\npuntos de vista de paralaje de la cámara, a ambos lados de la ubicación esperada del fiducial. La distancia<br/> entre los dos la fija el diámetro de paralaje.</p>\n<p>\nLa aplicación típica son los fiduciales muy reflectantes, como los de las PCB con acabado<br/>\nde superficie HASL (Hot Air Solder Leveling). Estos reflejan la cámara que asoma por el difusor y, por tanto,<br/> \nel fiducial puede aparecer (parcialmente) oscuro o mal formado para su detección.\n</p>\n<p>\nAl detectar desde un punto de vista de paralaje, el fiducial se ve en ángulo y reflejará el<br/>\ndifusor brillante de la luz de la cámara. Haciendo esto desde puntos de vista opuestos y simétricos, se puede<br/>\ntomar el punto medio para cancelar los errores de paralaje.\n</p>\n</html>
