GcodeDriverSettings.SettingsPanel.LetterVariablesLabel.toolTipText=Las variables de eje del Gcode se nombran con las letras de eje en lugar del tipo de eje.
GcodeDriverSettings.SettingsPanel.LogGCodeLabel.text=¿Registrar el G-code?
GcodeDriverSettings.SettingsPanel.LogGCodeLabel.toolTipText=Registrar el Gcode generado en un archivo aparte, dentro del subdirectorio driver de .openpnp2.
GcodeDriverSettings.SettingsPanel.MaxFeedRate.text=Velocidad de avance máx. [/min]
GcodeDriverSettings.SettingsPanel.MaxFeedRate.toolTipText=<html><p>Velocidad de avance máxima de la trayectoria de la herramienta, en unidades del driver por minuto. </p>\n<p>Póngalo a 0 para deshabilitarlo y usar sólo los límites de velocidad de avance de los ejes. Los movimientos diagonales serán entonces más rápidos. </p>\n</html>
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.text=Tipo de control del movimiento
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.toolTipText=<html>\n<p>Determina cómo el MotionPlanner de OpenPnP planificará el movimiento y cómo hablará <br/>\ncon el controlador\:</p>\n<ul>\n\n<li><strong>ToolpathFeedRate\:</strong><br/>\nAplicar a la trayectoria de la herramienta el límite nominal de velocidad de avance del driver multiplicado por el factor de velocidad.<br/>\nHay que especificar la velocidad de avance del driver. No se aplica ningún control de la aceleración.</li>\n\n<li><strong>EuclideanAxisLimits\:</strong><br/>\nAplicar los límites de velocidad de avance, aceleración y jerk de los ejes multiplicados por los factores de velocidad correspondientes. <br/>\nSe calcula la métrica euclídea para que la máquina pueda ir más rápido en diagonal.<br/>\nOpenPnP sólo fija el máximo del factor de velocidad; aumentar y reducir la velocidad se <br/>\ndeja por completo al controlador. </li>  \n\n<li><strong>ConstantAcceleration\:</strong><br/>\nPlanificar el movimiento suponiendo un controlador con control de movimiento de aceleración constante. </li>\n\n<li><strong>ModeratedConstantAcceleration\:</strong><br/>\nPlanificar el movimiento suponiendo un controlador con control de aceleración constante, pero<br/>\nmoderando la aceleración y la velocidad para que se parezcan a las del control de tercer orden, con lo que<br/>\nresulta un movimiento que tarda lo mismo y tiene una aceleración media similar. <br/>\nEsto ya reduce algo las vibraciones.</li>\n\n<li><strong>SimpleSCurve\:</strong><br/>\nPlanificar el movimiento suponiendo un controlador con control de movimiento en curva S simplificada. <br/>\nLas curvas S simplificadas no tienen fase de aceleración constante, sólo fases de jerk (por ejemplo TinyG, Marlin).</li>\n\n<li><strong>Simulated3rdOrderControl\:</strong><br/>\nPlanificar el movimiento suponiendo un controlador con control de aceleración constante pero<br/>\nsimulando el control de tercer orden mediante interpolación por pasos de tiempo. </li> \n\n<li><strong>Full3rdOrderControl\:</strong><br/>\nPlanificar el movimiento suponiendo un controlador con control de movimiento de tercer orden completo.</li> \n\n</html>
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.text=¿Eliminar los comentarios?
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.toolTipText=<html>\n<p>Eliminar los comentarios del G-code para acelerar las transmisiones <br/>\nal controlador.</p>\n<p>Nota\: esto sólo funciona con el estilo de sintaxis de G-code.</p>\n<p>Ejemplo\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 <span style\="color\:\#007700">(move to)</span> X100 Y20 <span style\="color\:\#007700">; move to the given X, Y</span><br/></code></p>\n<p>se envía como\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 X100 Y20 </code></p>\n</html>
