# Convenciones terminológicas del español (es)
#
# Principio general: se traduce todo lo que tiene un equivalente establecido en español técnico y
# se conserva en inglés únicamente lo que el usuario necesita reconocer tal cual en el wiki, en
# las capturas de pantalla de la comunidad y en los mensajes de log de OpenPnP. Cuando un término
# se conserva en inglés dentro de prosa larga, se añade una glosa entre paréntesis la primera vez
# que aparece en ese texto, por ejemplo «backlash (holgura mecánica)».
#
# Mayúsculas: se sigue la ortografía española, es decir sólo la primera palabra y los nombres
# propios llevan mayúscula («Guardar configuración», no «Guardar Configuración»). Las 66 entradas
# que ya existían antes de esta ronda usan el uso inglés de mayúscula en cada palabra; se han
# dejado como estaban porque no se pueden reescribir desde el flujo de lotes.
#
# Términos traducidos:
#   actuator actuador          nozzle boquilla        nozzle tip punta de boquilla
#   feeder alimentador         head cabezal           camera cámara
#   machine máquina            axis eje               board placa
#   panel panel                job tarea              placement colocación
#   location ubicación         part pieza             package encapsulado
#   vision visión              controller controlador  offset desplazamiento
#   feed rate velocidad de avance                     units per pixel unidades por píxel
#   settling estabilización    pick recoger           place colocar
#   discard descartar          home (posición) origen  to home referenciar
#   homed referenciada         tape cinta             reel carrete
#   tray bandeja               wizard asistente       tab pestaña
#   probe palpar / sonda       probing palpado        signaler señalizador
#   issues and solutions problemas y soluciones       enabled/disabled habilitado/deshabilitado
#
# Términos que se conservan deliberadamente en inglés, y por qué:
#   Safe Z, Camera Z  Conceptos de coordenadas que aparecen en decenas de pantallas y en todo el
#                     wiki. «Z segura» no aclara nada y rompe la correspondencia con la
#                     documentación, que es lo único que tiene el usuario cuando pide ayuda.
#   Gcode, G-code     Nombre técnico universal; nadie escribe «código G» en la práctica.
#   Driver            Concepto propio de OpenPnP (GcodeDriver, SimulatedUpDriver...). Traducirlo
#                     como «controlador» lo confundiría con el controller, que es la electrónica
#                     física y sí se traduce como «controlador».
#   Pipeline          Se refiere al objeto CvPipeline que el usuario edita en el editor de
#                     pipelines y que se guarda con ese nombre; «tubería» sería ininteligible.
#   Firmware          Uso normal en español técnico.
#   Backlash          Es la palabra que se usa en la práctica del CNC en español y titula la
#                     sección correspondiente del wiki. Se glosa como «holgura» cuando hace falta.
#   Jerk              No hay término establecido en español para la derivada de la aceleración.
#   Bottom Vision     Nombre de una función y de una pestaña de OpenPnP; se glosa como «visión
#                     inferior» cuando el espacio lo permite.
#   Nombres de clases e implementaciones (ReferenceNozzle, BlindsFeeder, ContactProbeNozzle...),
#   G-code, expresiones regulares, nombres de propiedades y los valores de las enumeraciones que
#   OpenPnP guarda en machine.xml: traducirlos rompería la configuración del usuario.
#
# El proceso de lotes y las comprobaciones están descritos en TRANSLATIONS.md y en
# tools/i18n/README.md.

