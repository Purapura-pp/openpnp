GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.text=Número máximo de pasos de jerk
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.toolTipText=<html>\r\nNúmero máximo de pasos de interpolación usados para simular el control del jerk.<br/>\r\nEsto significa que la aceleración se aumentará o se reducirá en tantos pasos <br/>\r\nrespecto a la aceleración máxima.\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.text=Número máximo de pasos
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.toolTipText=<html>\r\nNúmero máximo de pasos que se pueden usar para interpolar un movimiento.<br>\r\nUse una parte de la profundidad máxima de cola de su controlador. <br/>\r\nSi se supera el número, el planificador de movimiento recurrirá a un único movimiento moderado. \r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.text=Ticks mínimos de resolución del eje
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.toolTipText=<html>\r\n<p>Distancia mínima de paso del eje usada para interpolar trayectorias de movimiento avanzadas.</p>\r\n<p>Se indica en pasos de resolución de los ejes.</p>\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.text=Tiempo mínimo de paso [s]
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.toolTipText=<html>\r\n<p>Paso de tiempo mínimo usado para interpolar trayectorias de movimiento avanzadas. Se indica en segundos.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.Border.title=Ajustes
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.text=¿Control de flujo por confirmación?
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.toolTipText=<html>\r\n<p>La comunicación con el controlador se regula esperando el "ok"<br/>\r\nantes de enviar el comando siguiente. </p>\r\n<p>Esto es más lento que otros tipos de control de flujo, como RTS/CTS en una conexión serie, así que <br/>\r\nes preferible usar estos últimos.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.text=¿Confirmación de la ubicación?
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.toolTipText=<html>Pedir al controlador que informe de la ubicación después de completar un movimiento.<br/>\r\nSi ha cambiado, se actualiza la ubicación interna de OpenPnP. El informe de ubicación también <br/>\r\nse usa para sincronizar OpenPnP cuando el control de flujo por confirmación está deshabilitado.<br/>\r\nDebe estar habilitada al menos una de las dos opciones. La confirmación de ubicación permite<br/>\r\nun funcionamiento asíncrono más amplio. \r\n</html>
