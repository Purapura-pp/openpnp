BacklashCompensationConfigurationWizard.Action.Calibrate.Description=<html>\r\n<p>Calibrar los ajustes de compensación de backlash del eje usando el fiducial de calibración.</p>\r\n<p>Asegúrese de que el útil de calibración está montado y presente.</p><p>Considere usar esta función desde «Problemas y soluciones», donde obtiene instrucciones paso a paso<br/>\r\npara los preparativos necesarios y para hacer la calibración en el orden correcto. También obtiene abundantes enlaces al wiki.</p>\r\n</html>
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.BacklashOffsetLabel.text=Desplazamiento del backlash
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.Border.title=Compensación y calibración del backlash
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.CompensationMethodLabel.text=Método de compensación
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.CompensationMethodLabel.toolTipText=<html>\n<p>La compensación de backlash se usa para evitar los efectos de las holguras o del juego de las <br/>\nuniones mecánicas del eje.  Cuando el accionamiento invierte el sentido de la marcha, <br/>\nsuele haber un instante en el que no ocurre nada, porque hay que salvar la flojedad de una correa <br/>\no el juego de un husillo, de un piñón y cremallera, etc., antes de que se pueda volver a <br/>\ntransmitir la fuerza mecánica.</p>\n\n<ul>\n<li>\n<strong>None\:</strong>\nNo se aplica ninguna compensación de backlash. </li>\n<li>\n<strong>OneSidedPositioning\:</strong><br/>\nLa compensación se aplica llegando siempre a la posición final desde el mismo lado.<br/>\nEl desplazamiento de backlash no necesita ser muy preciso, es decir, puede ser mayor que el<br/> \nbacklash real y la máquina acabará igualmente en la posición correcta.<br/>\nLa máquina siempre tiene que hacer un movimiento adicional y forzará una parada completa<br/>\n de la máquina entre los segmentos de movimiento.</li>\n<li>\n<strong>OneSidedOptimizedPositioning\:</strong><br/>\nFunciona como OneSidedPositioning, salvo que sólo hace un movimiento adicional cuando llega <br/>\ndesde el lado equivocado. Sólo hace falta la mitad de los movimientos adicionales.</li>\n<li>\n<strong>DirectionalCompensation (¡experimental\!)\:</strong><br/>\nLa compensación se aplica en el sentido de la marcha. El desplazamiento se suma a la <br/>\ncoordenada de destino real si el movimiento va en el sentido del desplazamiento (que puede ser positivo <br/>\no negativo), y no se suma nada si va en sentido contrario.<br/>\nNo hacen falta movimientos adicionales. La máquina también puede moverse con más fluidez, porque no <br/>\nhace falta cambiar de sentido.<br/>\nSin embargo, el desplazamiento debe coincidir exactamente con el backlash físico.</li>\n</ul>\n</html>
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.DistanceTestLabel.text=<html>\n<body style\="text-align\:right">\n<p>\nBacklash <span style\="color\:\#005BD9">&mdash;&mdash;</span>\n</p>\n<p>\nEnvolvente <span style\="color\:\#000077">&mdash;&mdash;</span>\n</p>\n<p>\nSobrepaso <span style\="color\:\#FF0000">&mdash;&mdash;</span>\n</p>\n<p>\nAleatorio <span style\="color\:\#BB7700">&mdash;&mdash;</span>\n</p>\n<br/>\n<p>\nTiempo de movimiento <span style\="color\:\#00AA00">&mdash;&mdash;</span>\n</p>\n<br/>\n<br/>\n<p>\nida/ <span style\="color\:\#777777">vuelta</span><br/>\nsegún la distancia del movimiento.\n<p/>\n</body>\n</html>
