AbstractReferenceDriverConfigurationWizard.lblMinSupportedSpeed.text=Velocidad mínima
AbstractReferenceDriverConfigurationWizard.lblMinSupportedSpeed.toolTipText=<html>\r\n<p>\r\nVelocidad mínima en % totalmente admitida por el driver.\r\n</p><p>\r\nUnas velocidades mínimas excesivamente bajas obligan a una precisión excesiva en las<br/>\r\nvelocidades de avance y en las tasas de aceleración (y de jerk). Manteniendo la velocidad mínima en % en<br/>\r\nvalores razonables (por ejemplo, 5%), el cálculo se puede optimizar. <br/>\r\nHacen falta menos decimales (GcodeDriver), lo que reduce el ancho de banda<br/>\r\nserie necesario.\r\n</p><p>\r\nSiguen siendo posibles velocidades menores, pero cambiarán ligeramente el comportamiento,<br/>\r\npor ejemplo acelerará más rápido y avanzará a velocidad de crucero más tiempo.\r\n</p>\r\n</html>\r\n
