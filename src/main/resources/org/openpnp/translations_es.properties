GcodeDriverSettings.lblCompressExcludes.text=Caracteres excluidos de la compresión
GcodeDriverSettings.lblCompressExcludes.toolTipText=<html>\r\n<p>\r\nLa compresión del G-code sigue las reglas de la norma NIST RS274NGC<br/>\r\npara las líneas de comandos G y M simples.<br/>\r\nSin embargo, hay algunas extensiones de la sintaxis, estándar y propietarias,<br/>\r\nen las que no es admisible comprimir ni eliminar comentarios. Para admitir esas<br/>\r\nextensiones puede indicar una lista de caracteres que hagan de <em>corchetes</em> o<br/>\r\nde <em>comillas</em> alrededor de esas partes de las líneas de comandos. \r\n</p>\r\n<p>\r\nEstos son ejemplos típicos\:<br/>\r\n<code>&quot; &\#x27; &lt;&gt; {} [] ()</code><br/>\r\n</p>\r\n<p>\r\nDebido a posibles ambigüedades de sintaxis (escapes, anidamiento), todo lo que hay entre<br/>\r\nel carácter de exclusión más a la izquierda y el más a la derecha se excluye de forma defensiva de la<br/>\r\ncompresión y de la eliminación de comentarios. Si sólo se encuentra un carácter de exclusión,<br/>\r\nse excluye el resto de la línea.<br/>\r\n</p>\r\n<p>\r\nNotas\: use los caracteres <code>[]</code> para admitir las <em>expresiones</em> de la sección<br/>\r\n3.3.2.3 de NIST RS274NGC. Añada los caracteres <code>()</code> si quiere conservar<br/>\r\nlos comentarios entre paréntesis al eliminar los comentarios. Los comentarios de fin de línea<br/>\r\ncon punto y coma se seguirán eliminando.\r\n</p>\r\n</html>
GcodeDriverSettings.lblMinSpeed.text=Velocidad mínima admitida %
GcodeDriverSettings.lblMinSpeed.toolTipText=<html>\r\n<p>\r\nVelocidad mínima en % admitida por el driver.\r\n</p><p>\r\nUnas velocidades mínimas excesivamente bajas obligan a una precisión excesiva en las<br/>\r\nvelocidades de avance y en las tasas de aceleración (y de jerk). Manteniendo la velocidad mínima en % en<br/>\r\nvalores razonables (por ejemplo, 5%), el cálculo y la generación de G-code se pueden<br/>\r\noptimizar. Hacen falta menos decimales en el G-code, lo que reduce el ancho de banda<br/>\r\nserie necesario.\r\n</p><p>\r\nSiguen siendo posibles velocidades menores, pero cambiarán ligeramente el comportamiento,<br/>\r\npor ejemplo acelerará más rápido y avanzará a velocidad de crucero más tiempo.\r\n</p>\r\n</html>\r\n
