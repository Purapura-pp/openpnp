BlindsFeederArrayConfigurationWizard.lblNormalize.toolTipText=<html>\r\nNormalizar las distancias y el cizallamiento de los fiduciales a los valores <br />\r\nteóricamente correctos (cuadrícula cuadrada de milímetros enteros). Esto significa que confía más en la mecánica  <br />\r\nde su máquina y de su impresora 3D que en las determinaciones de los fiduciales por visión artificial.  <br />\r\nLa posición y el ángulo absolutos globales los sigue determinando la visión. \r\n</html>
