CameraConfigurationWizard.basicCalibrationInstructions=<html><ol><li>Coloque sobre la mesa un objeto de anchura y longitud conocidas. El papel cuadriculado es una buena opción y muy sencilla.<li>Introduzca la anchura y la longitud del objeto en los campos X e Y de las dimensiones del objeto.<li>Cámara superior\: mueva la cámara hasta centrarla sobre el objeto y enfocarlo.<li>Cámara inferior\: coloque el objeto plano sobre la cámara de modo que quede enfocado.<li>Pulse Medir y use el rectángulo de selección de la cámara para medir el objeto. <li>Pulse Confirmar cuando termine.<li>Los valores calculados de unidades por píxel se introducirán en los campos X e Y.</ol></html>
CameraConfigurationWizard.downLookingCalibrationInstructions=<html>Calibrar las unidades por píxel a dos niveles Z distintos permite a OpenPnP interpretar correctamente los tamaños de los objetos en 3D, es decir, a cualquier distancia de la cámara. Si ya ha calibrado en 2D, aun así necesita dos mediciones 3D nuevas. Calibrar en 3D exige tener configuradas las ubicaciones de la boquilla y de la cámara, los desplazamientos, Safe Z y el movimiento básico de la máquina. <ol><li>Elija un objeto rectangular de anchura y longitud conocidas que quepa dentro del campo de visión de la cámara. El papel cuadriculado es una buena opción y muy sencilla. Introduzca la anchura y la longitud del objeto en los campos X e Y de las dimensiones del objeto.<li>Coloque el objeto sobre la mesa. Tenga en cuenta que las unidades por píxel primarias deben calibrarse a una altura Z parecida a la de la cara superior de las placas de circuito que se van a poblar, y las secundarias lo más alto posible con el objeto todavía razonablemente enfocado. El objeto debe caber con holgura en el campo de visión a las dos alturas.<li>Sitúe la boquilla sobre el centro del objeto y bájela hasta que apenas toque la superficie. <li>Si está calibrando las unidades por píxel primarias, ahora puede pulsar el botón de capturar la Z de la boquilla para capturar la altura de trabajo predeterminada (superficie de la placa de circuito).<li>Pulse Medir para situar automáticamente la cámara sobre el objeto y use el rectángulo de selección de la vista de la cámara para medir el objeto. Si el objeto no está perfectamente enfocado, tome la mitad de los bordes borrosos para la medición. Pulse Confirmar cuando termine.<li>Los valores calculados de unidades por píxel se introducirán en los campos X e Y. Se registran las coordenadas Z del objeto y de la cámara de la medición.<li>Coloque un separador bajo el objeto para la medición secundaria o, en las máquinas que pueden mover físicamente la cámara superior en Z, suba la cámara lo más alto posible con el objeto todavía razonablemente enfocado. <li>Repita los pasos 3 a 6 para las unidades por píxel secundarias. </ol></html>
CameraConfigurationWizard.upLookingCalibrationInstructions=<html>Calibrar las unidades por píxel a dos niveles Z distintos permite a OpenPnP interpretar correctamente los tamaños de los objetos en 3D, es decir, a cualquier distancia de la cámara. Si ya ha calibrado en 2D, aun así necesita dos mediciones 3D nuevas. Calibrar en 3D exige tener configuradas las ubicaciones de la boquilla y de la cámara, los desplazamientos, Safe Z y el movimiento básico de la máquina. <ol><li>Elija un objeto de anchura, longitud y grosor conocidos que quepa dentro del campo de visión de la cámara. Introduzca la anchura, la longitud y el grosor del objeto en los campos X, Y y Z de las dimensiones del objeto de arriba.<li>Coloque el objeto bien alineado sobre la mesa y recójalo con una boquilla.<li>Tenga en cuenta que las unidades por píxel primarias se calibran en la ubicación de la cámara que mira hacia arriba, mientras que las secundarias deben calibrarse en una ubicación más alta.<li>ADVERTENCIA\: si la boquilla no está ya sobre la posición de la cámara que mira hacia arriba, el paso siguiente la moverá automáticamente a esa posición.<li>Pulse Medir y use el rectángulo de selección de la cámara para medir el objeto.  Si es necesario, use el panel de movimiento manual para girar la boquilla de modo que el objeto quede alineado con el rectángulo de selección.  Si el objeto no está perfectamente enfocado, tome la mitad de los bordes borrosos para la medición.  Pulse Confirmar cuando termine.<li>Los valores calculados de unidades por píxel se introducirán en los campos X e Y. Se registran las coordenadas Z del objeto y de la cámara de la medición.<li>Suba la boquilla  lo más alto posible con el objeto todavía razonablemente enfocado. <li>Repita los pasos 5 y 6 para las unidades por píxel secundarias.</ol></html>
