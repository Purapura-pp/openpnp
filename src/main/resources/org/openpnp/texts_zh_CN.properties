# Translations for strings the source code carries as English prose rather than as a key.
#
# The Issues and Solutions descriptions are written that way, and their English wording is also
# their persisted identity - see Solutions.Issue.getFingerprint - so the English is the key here
# and stays untranslated in the source. Anything without an entry falls back to the English,
# which is also what happens to descriptions assembled from variables at runtime, since only
# whole strings are looked up.
#
# Keys are Java properties keys: spaces and : = # ! are backslash-escaped. Both files are read
# as UTF-8.

<html><h3>Assume\ a\ generic\ G-code\ controller</h3><p>When\ the\ M115\ command\ is\ not\ supported\ by\ your\ controller\ you\ can\ let\ OpenPnP\ propose\ a\ generic\ G-code\ configuration.</p><br/><p>You\ will\ likely\ need\ to\ hand-tune\ the\ G-code\ configuration\ to\ work\ with\ your\ controller.</p></html>=<html><h3>按通用 G-code 主控处理</h3><p>如果主控不支持 M115 命令，可以让 OpenPnP 提供一份通用的 G-code 配置。</p><br/><p>你多半还需要手工微调这份配置，才能与你的主控配合工作。</p></html>
<html><h3>Brighness\ and\ Key-Color</h3><p>The\ nozzle\ tip\ and/or\ background\ (shade)\ is\ color-keyed\ so\ computer\ vision\ can\ robustly\ distinguish\ background\ pixels\ from\ foreground\ pixels\ ("green-screening").\ Use\ for\ green\ Juki\ style\ nozzles.</p></html>=<html><h3>亮度与色键</h3><p>对吸嘴和/或背景（挡板）做色键处理，使机器视觉能可靠地区分背景像素与前景像素（即「绿幕」原理）。适用于 Juki 风格的绿色吸嘴。</p></html>
<html><h3>Brightness</h3><p>The\ background\ is\ just\ dark,\ the\ foreground\ is\ distinguished\ by\ brighness\ only.</p><br/></html>=<html><h3>亮度</h3><p>背景只是暗色，仅靠亮度区分前景。</p><br/></html>
<html><h3>Detect\ the\ firmware\ automatically</h3><p>The\ M115\ command\ must\ be\ supported\ by\ the\ firmware.\ Make\ sure\ the\ controller\ is\ connected\ to\ the\ computer\ and\ accept\ the\ solution\ to\ perform\ the\ detection.</p><br/><p>This\ might\ take\ a\ while\!</p><br/><p>If\ the\ firmware\ is\ known\ by\ OpenPnP,\ it\ will\ be\ able\ to\ automatically\ generate\ G-code\ configuration\ for\ you.</html>=<html><h3>自动检测固件</h3><p>固件必须支持 M115 命令。请确认主控已连接到电脑，然后接受该方案以开始检测。</p><br/><p>这可能需要一些时间！</p><br/><p>如果 OpenPnP 认得这个固件，它就能为你自动生成 G-code 配置。</html>
<html><h3>Dynamic\ Safe\ Z</h3><p>If\ a\ part\ is\ on\ the\ nozzle,\ the\ nozzle\ is\ lifted\ to\ Safe\ Z\ <strong>+</strong>\ part\ height.</p><br/><p>Safe\ Z\ must\ only\ account\ for\ the\ tallest\ obstacle.</p><br/><p>This\ will\ result\ in\ faster,\ more\ optimized\ machine\ motion.</p><br/><p><strong>Recommended.</strong>.</p><br/></html>=<html><h3>动态 Safe Z</h3><p>吸嘴上有元件时，抬升高度为 Safe Z <strong>加</strong> 元件高度。</p><br/><p>此时 Safe Z 只需考虑最高的障碍物。</p><br/><p>机器运动会更快、更优化。</p><br/><p><strong>推荐。</strong></p><br/></html>
<html><h3>Fixed\ Safe\ Z</h3><p>Safe\ Z\ is\ always\ at\ a\ fixed\ level.</p><br/><p>Safe\ Z\ must\ account\ for\ <em>both</em>\ the\ tallest\ obstacle\ <em>and</em>\ the\ tallest\ part\ on\ the\ nozzle.</p><br/><p>This\ will\ result\ in\ slower,\ less\ optimized\ machine\ motion.</p></html>=<html><h3>固定 Safe Z</h3><p>Safe Z 始终为一个固定高度。</p><br/><p>此时 Safe Z 必须<em>同时</em>兼顾最高的障碍物<em>和</em>吸嘴上最高的元件。</p><br/><p>机器运动会更慢、优化程度更低。</p></html>
<html><h3>Use\ Auto-Focus</h3><p>This\ is\ the\ recommended\ setting.</p></html>=<html><h3>使用自动对焦</h3><p>这是推荐的设置。</p></html>
<html><h3>Use\ nozzle\ Z\ location</h3><p><span\ style\="color\:red;">CAUTION\:</span>\ This\ will\ invalidate\ part\ height\ auto\ detection\ using\ auto\ focus.</p></html>=<html><h3>使用吸嘴 Z 位置</h3><p><span style\="color\:red;">注意：</span>这会使基于自动对焦的元件高度自动检测失效。</p></html>
A\ high\ Preview\ FPS\ value\ might\ create\ undue\ CPU\ load.=过高的 Preview FPS（预览帧率）会带来不必要的 CPU 负载。
A\ HTTPActuator\ with\ Read\ URL\ likely\ needs\ a\ regular\ Expression\ to\ parse\ the\ value.=配置了 Read URL 的 HTTPActuator 通常还需要一个正则表达式来解析返回值。
Accept\ to\ replace\ ACTUATOR_READ_COMMAND\ with\ ACTUATOR_READ_WITH_DOUBLE_COMMAND.\ Dismiss\ to\ remove\ read\ with\ double.=接受则用 ACTUATOR_READ_WITH_DOUBLE_COMMAND 替换 ACTUATOR_READ_COMMAND；忽略则移除 read with double。
Advanced\ Motion\ Planner\ not\ set.\ Accept\ or\ Dismiss\ to\ continue.=尚未启用 Advanced Motion Planner（高级运动规划器）。接受或忽略以继续。
Advanced\ motion\ planner\ set.\ Revert\ to\ a\ simpler,\ safer\ planner.=已启用高级运动规划器。可回退到更简单、更保险的规划器。
Assign\ a\ driver\ as\ described\ in\ the\ Wiki.=请按 Wiki 的说明指定一个驱动。
Assign\ a\ driver.=请指定一个驱动。
Assign\ the\ unique\ axis\ letter\ where\ wrong,\ press\ Accept,\ then\ press\ Find\ Issues\ &\ Solutions\ again\ to\ clear\ the\ correct\ one.=请把填错的轴改成各自唯一的轴字母，点击「接受」，然后再次执行「问题与解决方案」以消除已正确的那一条。
Avoid\ axis\ letter\ E,\ if\ possible.\ Use\ proper\ rotation\ axes\ instead.=尽量不要使用轴字母 E，改用正规的旋转轴。
Axes\ should\ be\ configured\ as\ linear\ in\ feedrate\ calculations\ on\ the\ RepRapFirmware\ controller.\ See\ the\ linked\ web\ page.=在 RepRapFirmware 主控上，进给速率计算中应将各轴配置为线性轴。详见链接页面。
Axis\ is\ not\ assigned\ to\ a\ driver.=该轴尚未指定驱动。
Axis\ letter\ is\ missing.\ Assign\ the\ letter\ to\ continue.=尚未指定轴字母。请先指定字母再继续。
Axis\ should\ be\ treated\ as\ a\ linear\ for\ detected\ firmware\ (all-primary\ axes\ mode).=按检测到的固件，该轴应作为线性轴处理（全主轴模式）。
Axis\ should\ be\ treated\ as\ linear\ according\ to\ its\ letter.=按该轴的字母判断，它应作为线性轴处理。
Axis\ should\ be\ treated\ as\ rotational\ according\ to\ its\ letter.=按该轴的字母判断，它应作为旋转轴处理。
Axis\ velocity\ limited\ by\ driver\ Maximum\ Feed\ Rate.\ =轴速度受到驱动的 Maximum Feed Rate（最大进给速率）限制。
Change\ of\ serial\ port\ Flow\ Control\ recommended.=建议更改串口的 Flow Control（流控制）设置。
Change\ to\ NullMotionPlanner=改用 NullMotionPlanner
Change\ to\ ReferenceAdvancedMotionPlanner=改用 ReferenceAdvancedMotionPlanner
Check\ axis\ letters\ and\ make\ sure\ the\ controller\ is\ capable\ to\ use\ extra\ axes\ (i.e.\ not\ extruders).=请检查各轴字母，并确认主控确实支持这些额外的轴（也就是说，它们不是挤出机轴）。
Check\ axis\ letters\ and\ make\ sure\ use\ a\ proper\ 6-axis\ configuration\ without\ extruders.=请检查各轴字母，并确认采用的是不含挤出机轴的正规六轴配置。
Check\ if\ your\ controller\ supports\ proper\ axes\ A\ B\ C\ (etc.)\ instead\ of\ "extruder"\ E.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请确认你的主控支持正规的 A B C 等轴，而不是只有「挤出机」轴 E。点击下方的蓝色信息按钮了解更多。
Check\ out\ firmwares\ known\ to\ be\ well\ supported.\ See\ info\ link.=建议了解已知支持良好的固件。详见信息链接。
Choose\ an\ advanced\ Motion\ Control\ Type\ for\ your\ controller\ type.=请为您的主控类型选择一种高级的 Motion Control Type（运动控制类型）。
Choose\ the\ right\ communications\ type\ and\ port/address\ settings.=请选择正确的通信类型与端口/地址设置。
Choose\ the\ simplest\ Motion\ Control\ Type\ for\ the\ first\ basic\ setup.=首次基础配置时，请选择最简单的 Motion Control Type（运动控制类型）。
Compress\ Gcode\ for\ superior\ communications\ speed.=启用 Compress Gcode（压缩 G 代码）可显著提升通信速度。
Connect\ the\ driver\ to\ your\ controller.=请将驱动连接到您的主控。
Contact\ probe\ actuator\ needs\ unconditional\ machine\ coordination\ after\ actuation.=接触探测执行器在动作之后需要无条件的机器协调。
Convert\ to\ GcodeAsyncDriver.=转换为 GcodeAsyncDriver。
Convert\ to\ GcodeDriver.=转换为 GcodeDriver。
Converting\ the\ ContactProbeNozzle\ back\ to\ a\ plain\ ReferenceNozzle\ may\ simplify\ the\ machine\ setup.=把 ContactProbeNozzle 换回普通的 ReferenceNozzle 可以简化机器配置。
Depending\ on\ the\ type\ of\ nozzle\ tip\ or\ shade,\ select\ the\ proper\ background\ calibration.=请根据吸嘴头或遮光罩的类型，选择合适的背景校准方式。
Determine\ the\ camera\ head\ offsets.=测定相机的贴装头偏移量。
Disable\ Allow\ Letter\ Pre-Move\ Commands.=关闭 Allow Letter Pre-Move Commands（允许字母移动前指令）。
Disable\ Compress\ G-code.=关闭 Compress G-code（压缩 G 代码）。
Disable\ Confirmation\ Flow\ Control\ for\ full\ asynchronous\ operation.=关闭 Confirmation Flow Control（确认流控制）以实现完全异步运行。
Disable\ Confirmation\ Flow\ Control.=关闭 Confirmation Flow Control（确认流控制）。
Disable\ Connection\ Keep-Alive.=关闭 Connection Keep-Alive（连接保活）。
Disable\ G-code\ compression\ for\ trouble-free\ operation\ with\ incompatible\ controllers.=关闭 G 代码压缩，以便与不兼容的主控稳定配合。
Disable\ Location\ Confirmation=关闭 Location Confirmation（位置确认）
Disable\ Remove\ Comments.=关闭 Remove Comments（移除注释）。
Disable\ Switch\ Linear\ ↔\ Rotational.=关闭「线性 ↔ 旋转」互换。
Disable\ Wrap\ Around.=关闭 Wrap Around（角度绕行）。
Disallow\ Pre-Move\ Commands\ for\ automatic\ G-code\ setup\ and\ other\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=禁用 Pre-Move Commands（移动前指令）方可使用自动 G 代码配置等高级功能。接受或忽略以继续。
Enable\ Auto\ Camera\ View.=启用 Auto Camera View（自动相机视图）。
Enable\ Auto\ tool\ select.=启用 Auto tool select（自动选择工具）。
Enable\ Compress\ Gcode.=启用 Compress Gcode（压缩 G 代码）。
Enable\ Confirmation\ Flow\ Control,\ controller\ has\ no\ axes,\ serial\ flow\ control\ is\ not\ available.=启用 Confirmation Flow Control（确认流控制）：主控没有报告轴，且串口流控不可用。
Enable\ Confirmation\ Flow\ Control,\ controller\ has\ no\ axes.=启用 Confirmation Flow Control（确认流控制）：主控没有报告轴。
Enable\ Confirmation\ Flow\ Control,\ serial\ flow\ control\ is\ not\ available.=启用 Confirmation Flow Control（确认流控制）：串口流控不可用。
Enable\ Confirmation\ Flow\ Control.=启用 Confirmation Flow Control（确认流控制）。
Enable\ Continuous\ Motion.=启用 Continuous Motion（连续运动）。
Enable\ Letter\ Variables.=启用 Letter Variables（字母变量）。
Enable\ Limit\ to\ Range.=启用 Limit to Range（限制在范围内）。
Enable\ Location\ Confirmation=启用 Location Confirmation（位置确认）
Enable\ Location\ Confirmation.=启用 Location Confirmation（位置确认）。
Enable\ Pre-Rotate.=启用 Pre-Rotate（预旋转）。
Enable\ Remove\ Comments.=启用 Remove Comments（移除注释）。
Enable\ Suspend\ during\ tasks.=启用 Suspend during tasks（任务期间挂起）。
Enable\ Switch\ Linear\ ↔\ Rotational.=启用「线性 ↔ 旋转」互换。
